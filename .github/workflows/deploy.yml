# Checks every push and pull request. A push to main that passes is built into an image,
# published to the container registry and rolled out to the server.
#
# The server never builds and never sees the source: it pulls a tag. Every deploy is
# therefore a tag that can be rolled back to by setting APP_IMAGE in its .env and running
# docker compose up -d.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deployment at a time, and never cancel one part way through.
concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # --no-incremental because an incremental build reports no warnings on the second run,
      # which would let a warning through unnoticed.
      - name: Build
        run: dotnet build --no-incremental --configuration Release

      - name: Test
        run: dotnet test --configuration Release

      - name: Check the tree is ASCII
        run: python tools/check-ascii.py

  publish:
    name: Publish the image
    needs: check
    # Stated on all three of these rather than left to the fact that a job whose dependency
    # was skipped is skipped in turn. What reaches the server should be readable here.
    #
    # A merged pull request arrives as a push to main and so does deploy. The ref is checked
    # as well as the event, or running this by hand from a branch would put that branch on
    # the server.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: the commit, which is what a deployment pins and what a rollback names,
      # and latest, for reading by hand.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Attach required reviewers to this environment to hold a deployment for approval.
    environment: production
    # Nothing is checked out: the server fetches what it needs for the commit itself.
    steps:
      - name: Authorise against the server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # One call, and the server decides what it means. The key is restricted to
      # deploy.sh there, so the commit below is the whole of what this can ask for: the
      # script fetches the compose file for it, backs the database up, pulls, restarts and
      # waits for the health endpoint, and fails the step if any of that does not happen.
      #
      # Migrations run as the application starts, so a bad one is felt during the rollout
      # rather than in a step of its own. The backup the script takes first is what makes
      # that recoverable.
      - name: Roll out
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"             '${{ github.sha }}'

  prune:
    name: Remove old image versions
    needs: deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Nothing expires on its own, so every deploy would otherwise leave a version behind
      # for good. The newest are kept so a rollback still has something to go back to.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
