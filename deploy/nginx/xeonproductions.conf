# nginx site for xeonproductions, for a host whose nginx already owns port 80.
#
# Two server blocks in one file: the canonical host, which proxies to the application,
# and every other name the site answers to, which redirects to it. nginx places no limit
# on server blocks per file; splitting them across files is only a convention.
#
# This is deliberately HTTP only. Do not add "listen 443 ssl" by hand: nginx refuses to
# start with an ssl listener that has no certificate, and the certificate cannot exist
# until the names resolve here. certbot edits both blocks in place, adding the TLS
# listener, the certificate paths and an http-to-https redirect, keeping everything below:
#
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx \
#     -d xeonproductions.com -d www.xeonproductions.com \
#     -d xeonproductions.net -d www.xeonproductions.net \
#     -d xeonproductions.dev -d www.xeonproductions.dev \
#     -d xeons.net           -d www.xeons.net
#
# Every name has to resolve to this server first. One failure aborts the whole run.
#
# Install:
#   sudo cp deploy/nginx/xeonproductions.conf /etc/nginx/sites-available/xeonproductions
#   sudo ln -s /etc/nginx/sites-available/xeonproductions /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires this at the http level in /etc/nginx/nginx.conf, which nginx does not provide
# by default:
#
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#
# Headers are written out rather than pulled in with "include proxy_params". That file
# ships with the Debian and Ubuntu packages only, so relying on it makes the config fail
# on any other build.

upstream xeon_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# The canonical host. This is the only name the application is served on.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name xeonproductions.com;

    # Media uploads are capped at 25 MB in the application, so nginx must not reject
    # them earlier with a 413.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/rss+xml application/xml image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/xeonproductions.access.log;
    error_log  /var/log/nginx/xeonproductions.error.log;

    # Served rather than proxied, so certificate renewal does not depend on the
    # application being up.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://xeon_app;
        proxy_http_version 1.1;

        # Blazor Server holds a websocket open for the life of the page. Without the
        # upgrade headers the connection is refused and every interactive admin screen
        # loads but stops responding to clicks, with nothing shown to explain it.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The application builds canonical URLs and decides about redirecting to https
        # from these, through ForwardedHeaders.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An idle circuit has to outlive nginx's default 60 seconds, or a page left open
        # while reading will keep dropping and reconnecting.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Uploaded media never changes once written, so it can be cached hard.
    location /media/ {
        proxy_pass http://xeon_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Downloads go through the application endpoint deliberately: it applies its own
    # rules and records the hit. Never point this at a directory on disk.
    #
    # Buffering and compression are off so byte ranges survive, which is what a
    # resumable download depends on.
    location /download/ {
        proxy_pass http://xeon_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        gzip off;
        proxy_read_timeout 1h;
    }
}

# ---------------------------------------------------------------------------
# Every other name, sent to the canonical host.
#
# Keeping one canonical address stops search engines splitting rankings across
# duplicates, and means the application only ever builds URLs for a single host.
#
# xeonproductions.dev is worth a note: the .dev top level domain is on the HSTS
# preload list, so browsers refuse to speak plain HTTP to it at all. That name is
# unreachable until it has a certificate, where the others redirect over HTTP in
# the meantime. Let's Encrypt validates over HTTP regardless, so issuing works.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name
        www.xeonproductions.com
        xeonproductions.net  www.xeonproductions.net
        xeonproductions.dev  www.xeonproductions.dev
        xeons.net            www.xeons.net;

    # The ACME challenge has to be served rather than redirected, or renewal fails
    # once the redirect below is in place.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # $request_uri keeps the path and query string, so a deep link into a sister
    # domain lands on the same page here rather than the home page.
    location / {
        return 301 https://xeonproductions.com$request_uri;
    }
}
