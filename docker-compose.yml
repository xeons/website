# Production stack: Caddy terminates TLS, the app runs plain HTTP behind it, Postgres holds
# the content. Copy .env.example to .env and fill it in before the first `docker compose up`.

services:
  db:
    # 15 or newer is required: the page slug index relies on NULLS NOT DISTINCT.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xeon}
      POSTGRES_USER: ${POSTGRES_USER:-xeon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xeon} -d ${POSTGRES_DB:-xeon}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  app:
    # Built here by default. A deployment sets APP_IMAGE to a tag from the registry in .env
    # and pulls that instead, so the server never builds and every deploy is a tag that can
    # be rolled back to.
    image: ${APP_IMAGE:-xeon-cms-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-xeon};Username=${POSTGRES_USER:-xeon};Password=${POSTGRES_PASSWORD}

      # Caddy owns TLS and the http-to-https redirect.
      Hosting__UseHttpsRedirection: "false"

      Media__StorageRoot: /app/media
      Downloads__StorageRoot: /app/downloads
      Stats__GeoDatabasePath: /app/geoip/GeoLite2-Country.mmdb
      Downloads__MaxFileSizeBytes: ${DOWNLOAD_MAX_BYTES:-2147483648}
      DataProtection__KeysPath: /app/keys

      Smtp__Enabled: ${SMTP_ENABLED:-false}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM:-noreply@xeonproductions.com}
      Smtp__NotificationAddress: ${SMTP_TO:-}

      # Only used on the very first run; blank means no account is created.
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      Seed__AdminDisplayName: ${ADMIN_NAME:-Brandon}
    # Bound to loopback, not 0.0.0.0: this is how a reverse proxy already running on the
    # host reaches the app, without the port being open to the network. Caddy does not use
    # it, it reaches app:8080 over the compose network.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - media-data:/app/media
      - downloads-data:/app/downloads
      - ./deploy/geoip:/app/geoip:ro
      - keys-data:/app/keys
    networks:
      - internal
      - web

  # Only starts with --profile caddy. On a host that already has nginx or Apache on
  # 80 and 443, leave the profile off and put the server block in
  # deploy/nginx/ in front of the app instead.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web

volumes:
  db-data:
  media-data:
  downloads-data:
  keys-data:
  caddy-data:
  caddy-config:

networks:
  # The database is not reachable from the proxy network.
  internal:
    internal: true
  web:
